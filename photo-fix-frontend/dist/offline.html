<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6c4cf1" />
    <title>Offline — Pixel Graphic Studio</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Poppins", ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: linear-gradient(160deg, #f7f1fb 0%, #eef3ff 100%);
        color: #1b2431;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #6c4cf1, #2f6bff);
        color: #fff;
      }
      h1 { font-size: 1.35rem; margin: 0 0 8px; }
      p { margin: 0 0 20px; line-height: 1.6; color: #4b5563; }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(90deg, #6c4cf1, #2f6bff);
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1d1d1f; color: #e5e7eb; }
        p { color: #9ca3af; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="14" rx="3" /><circle cx="12" cy="12" r="3.2" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>Check your connection and try again. Pages you've already visited will still work.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
